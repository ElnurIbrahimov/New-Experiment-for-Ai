# NovelFormer-B: 6-way stack (DiffAttn + SSMax + MoD + MoE++ + CoPE + nGPT)
d_model: 768
n_heads: 12
n_layers: 12
d_ff: 2048
vocab_size: 50304
max_seq_len: 1024
dropout: 0.0
tie_embeddings: false

use_diff_attn: true
use_ssmax: true
use_mod: true
use_moe_pp: true
use_ngpt: true
use_titans: false
use_cope: true

# MoD params
mod_capacity_ratio: 0.5
mod_aux_loss_weight: 0.01

# MoE++ params
moe_n_experts: 8
moe_n_zero_experts: 2
moe_n_copy_experts: 1
moe_n_const_experts: 1
moe_top_k: 2
moe_aux_loss_weight: 0.01

# CoPE params
cope_npos_max: 2048

lr: 3e-4
min_lr: 3e-5
weight_decay: 0.1
warmup_steps: 500
max_steps: 50000
batch_size: 8
seq_len: 1024
gradient_accumulation_steps: 16
dtype: bfloat16

dataset_name: HuggingFaceFW/fineweb-edu
dataset_subset: sample-10BT
tokenizer: gpt2

log_interval: 10
eval_interval: 500
eval_steps: 50
checkpoint_interval: 1000
experiment_name: novelformer_b
