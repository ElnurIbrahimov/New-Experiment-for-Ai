# Differential Attention only
d_model: 768
n_heads: 12
n_layers: 12
d_ff: 2048
vocab_size: 50304
max_seq_len: 1024
dropout: 0.0
tie_embeddings: true

use_diff_attn: true
use_ssmax: false
use_mod: false
use_moe_pp: false
use_ngpt: false
use_titans: false
use_cope: false

lr: 3e-4
min_lr: 3e-5
weight_decay: 0.1
warmup_steps: 500
max_steps: 50000
batch_size: 8
seq_len: 1024
gradient_accumulation_steps: 4
dtype: bfloat16
compile: true

dataset_name: HuggingFaceFW/fineweb-edu
dataset_subset: sample-10BT
tokenizer: gpt2

log_interval: 10
eval_interval: 500
eval_steps: 50
checkpoint_interval: 1000
experiment_name: diff_attn
